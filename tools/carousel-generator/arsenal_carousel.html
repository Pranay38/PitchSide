<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Touchline Dribble — Arsenal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:       #16A34A;
  --green-light: #4ADE80;
  --green-dark:  #0D5C2A;
  --off-white:   #F2F5F0;
  --charcoal:    #0E1510;
  --mid-grey:    #8A9E8F;
}

body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 32px 20px 60px;
  font-family: 'Outfit', sans-serif;
}

/* ── IG FRAME ── */
.ig-frame {
  width: 420px;
  background: #1A1A1A;
  border-radius: 16px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.65);
  overflow: hidden;
}

.ig-header {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px 9px;
}

.ig-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  overflow: hidden; flex-shrink: 0;
  box-shadow: 0 0 0 2px var(--green), 0 0 0 4px #1A1A1A;
  background: var(--green);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
}

.ig-handle { font-size: 13px; font-weight: 600; color: #fff; }
.ig-sub { font-size: 11px; color: #555; }
.ig-more { margin-left: auto; color: #555; font-size: 18px; cursor: pointer; }

/* ── CAROUSEL ── */
.carousel-viewport {
  width: 420px; height: 525px;
  overflow: hidden; position: relative;
  cursor: grab; touch-action: pan-y;
}
.carousel-viewport:active { cursor: grabbing; }
.carousel-track {
  display: flex; height: 100%;
  transition: transform 0.36s cubic-bezier(0.4,0,0.2,1);
  will-change: transform;
}

/* ── SLIDES ── */
.slide {
  width: 420px; height: 525px;
  flex-shrink: 0; position: relative;
  overflow: hidden; display: flex; flex-direction: column;
}

/* ── PROGRESS BAR ── */
.prog {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 10px 24px 16px;
  display: flex; align-items: center; gap: 10px;
  z-index: 20;
}
.prog-track {
  flex: 1; height: 3px; border-radius: 99px; overflow: hidden;
}
.prog-fill { height: 100%; border-radius: 99px; }
.prog-num {
  font-size: 10px; font-weight: 600; font-family: 'Outfit', sans-serif;
  letter-spacing: 0.5px; white-space: nowrap;
}

/* ── SWIPE ARROW ── */
.arrow {
  position: absolute; right: 0; top: 0; bottom: 0;
  width: 42px; display: flex; align-items: center; justify-content: center;
  z-index: 15; pointer-events: none;
}

/* ── IG BOTTOM ── */
.ig-dots {
  display: flex; justify-content: center; gap: 5px; padding: 8px 0;
  background: #1A1A1A;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #333; transition: background 0.3s, transform 0.3s;
}
.dot.active { background: #3897f0; transform: scale(1.2); }

.ig-actions {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 14px 6px; background: #1A1A1A;
}
.ig-icon { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ig-bookmark { margin-left: auto; }

.ig-caption {
  padding: 5px 14px 16px; background: #1A1A1A;
  font-size: 12.5px; color: #ccc; font-family: 'Outfit', sans-serif; line-height: 1.45;
}
.ig-caption strong { color: #fff; }
.ig-caption .hash { color: #3897f0; }
</style>
</head>
<body>

<div class="ig-frame">
  <!-- Header -->
  <div class="ig-header">
    <div class="ig-avatar">TD</div>
    <div>
      <div class="ig-handle">thetouchlinedribble</div>
      <div class="ig-sub">Original Audio</div>
    </div>
    <div class="ig-more">•••</div>
  </div>

  <!-- Carousel Viewport -->
  <div class="carousel-viewport" id="viewport">
    <div class="carousel-track" id="track"></div>
  </div>

  <!-- IG Actions & Dots -->
  <div class="ig-actions">
      <svg class="ig-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      <svg class="ig-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      <svg class="ig-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      <div class="ig-bookmark">
         <svg class="ig-icon" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      </div>
  </div>
  
  <div class="ig-dots" id="dots"></div>
  
  <!-- Caption -->
  <div class="ig-caption">
    <strong>thetouchlinedribble</strong> The April curse strikes again... but are we actually completely out of it? 👇<br><br>
    <span class="hash">#Arsenal #coyg #premierleague</span>
  </div>
</div>

<script>
  /* Slides Data */
  const slidesData = [
    {
      bg: 'var(--off-white)',
      color: 'var(--charcoal)',
      content: \`
        <div style="flex: 1; display:flex; flex-direction:column; justify-content:center; padding: 40px;">
          <div style="font-family: 'Outfit'; font-weight:700; font-size:12px; color:var(--green); letter-spacing:1px; text-transform:uppercase; margin-bottom: 20px;">@thetouchlinedribble</div>
          <h1 style="font-family: 'Bebas Neue'; font-size: 52px; line-height: 0.9; margin-bottom: 16px;">Arsenal bottling it...<br><span style="color:var(--green);">again?</span> 📉</h1>
          <p style="font-family: 'Outfit'; font-size: 16px; color: #555; line-height: 1.4;">The April curse strikes. We're terrified, but are we actually completely out of it?</p>
        </div>
      \`
    },
    {
      bg: 'var(--charcoal)',
      color: '#fff',
      content: \`
        <div style="flex: 1; display:flex; flex-direction:column; justify-content:center; padding: 40px;">
          <div style="display:inline-block; padding:4px 12px; background: rgba(255,255,255,0.1); border-radius: 100px; font-size: 11px; font-weight: 600; font-family:'Outfit'; text-transform:uppercase; letter-spacing: 1px; color: var(--green-light); margin-bottom: 20px; align-self:flex-start;">The Trauma 💔</div>
          <h2 style="font-family: 'Barlow Condensed'; font-weight:700; font-size: 42px; text-transform:uppercase; line-height: 1; margin-bottom: 16px;">The script writers<br>are lazy.</h2>
          <p style="font-family: 'Outfit'; font-size: 15px; color: #aaa; line-height: 1.5; margin-bottom:24px;">A devastating loss to Aston Villa. Stumbling against Bayern. It feels like exactly the same collapse as last season.</p>
          
          <div style="padding: 16px; background: rgba(255,255,255,0.05); border-left: 3px solid var(--green); border-radius: 4px;">
             <div style="font-family:'Outfit'; font-size:11px; color:#888; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">Every Rival Fan</div>
             <div style="font-family:'Outfit'; font-size:15px; font-weight:500; font-style:italic;">"Arsenal falling apart in April... inevitable."</div>
          </div>
        </div>
      \`
    },
    {
      bg: 'linear-gradient(145deg, var(--green-dark), var(--green))',
      color: '#fff',
      content: \`
        <div style="flex: 1; display:flex; flex-direction:column; justify-content:center; padding: 40px; text-align:center; align-items:center;">
          <h2 style="font-family: 'Bebas Neue'; font-size: 56px; line-height: 0.95; margin-bottom: 20px;">But before you panic...<br>Look at City's fixtures.</h2>
          <p style="font-family: 'Outfit'; font-size: 16px; color: rgba(255,255,255,0.9); line-height: 1.4;">We're all assuming City will win out. But the Premier League is chaos, and their run-in is far from a cakewalk.</p>
        </div>
      \`
    },
    {
      bg: 'var(--off-white)',
      color: 'var(--charcoal)',
      content: \`
        <div style="flex: 1; display:flex; flex-direction:column; justify-content:center; padding: 40px;">
          <h2 style="font-family: 'Barlow Condensed'; font-weight:700; font-size: 42px; text-transform:uppercase; line-height: 1; margin-bottom: 24px; color: var(--green-dark);">The City Run-In 🏃‍♂️</h2>
          
          <div style="display:flex; gap:16px; margin-bottom: 16px; padding-bottom:16px; border-bottom: 1px solid rgba(0,0,0,0.05);">
            <div style="font-size:20px;">🏟️</div>
            <div>
              <div style="font-family:'Outfit'; font-weight:700; font-size:16px; margin-bottom:4px;">Spurs Away</div>
              <div style="font-family:'Outfit'; font-size:13px; color:#666; line-height:1.4;">The ultimate bogey game. They haven't scored a league goal at the new stadium.</div>
            </div>
          </div>
          
          <div style="display:flex; gap:16px; margin-bottom: 16px; padding-bottom:16px; border-bottom: 1px solid rgba(0,0,0,0.05);">
            <div style="font-size:20px;">🌊</div>
            <div>
              <div style="font-family:'Outfit'; font-weight:700; font-size:16px; margin-bottom:4px;">Brighton Away</div>
              <div style="font-family:'Outfit'; font-size:13px; color:#666; line-height:1.4;">A Thursday night trap against De Zerbi ball.</div>
            </div>
          </div>
          
          <div style="display:flex; gap:16px;">
            <div style="font-size:20px;">🤯</div>
            <div>
              <div style="font-family:'Outfit'; font-weight:700; font-size:16px; margin-bottom:4px;">Champions League Hangover</div>
              <div style="font-family:'Outfit'; font-size:13px; color:#666; line-height:1.4;">The emotional toll of Madrid is real. Legs are getting heavy.</div>
            </div>
          </div>
        </div>
      \`
    },
    {
      bg: 'var(--charcoal)',
      color: '#fff',
      content: \`
        <div style="flex: 1; display:flex; flex-direction:column; justify-content:center; padding: 40px;">
          <h2 style="font-family: 'Barlow Condensed'; font-weight:700; font-size: 42px; text-transform:uppercase; line-height: 1; margin-bottom: 24px;">Why Arsenal <span style="color:var(--green-light);">aren't dead</span></h2>
          
          <div style="display:flex; gap:16px; margin-bottom: 20px;">
            <div style="font-family:'Bebas Neue'; font-size:36px; color:var(--green); line-height:1;">01</div>
            <div style="padding-top:4px;">
              <div style="font-family:'Outfit'; font-weight:700; font-size:16px; margin-bottom:4px;">Goal Difference FC</div>
              <div style="font-family:'Outfit'; font-size:13px; color:#aaa; line-height:1.4;">We still hold the GD advantage. If we finish level on points, we win the title.</div>
            </div>
          </div>
          
          <div style="display:flex; gap:16px;">
            <div style="font-family:'Bebas Neue'; font-size:36px; color:var(--green); line-height:1;">02</div>
            <div style="padding-top:4px;">
              <div style="font-family:'Outfit'; font-weight:700; font-size:16px; margin-bottom:4px;">The Defense is Real</div>
              <div style="font-family:'Outfit'; font-size:13px; color:#aaa; line-height:1.4;">The Villa game was a blip. Saliba & Gabriel are still the best pairing in Europe.</div>
            </div>
          </div>
        </div>
      \`
    },
    {
      bg: 'var(--off-white)',
      color: 'var(--charcoal)',
      content: \`
        <div style="flex: 1; display:flex; flex-direction:column; justify-content:center; padding: 40px;">
          <h2 style="font-family: 'Barlow Condensed'; font-weight:700; font-size: 38px; text-transform:uppercase; line-height: 1; margin-bottom: 24px;">How to cope as a fan</h2>
          
          <div style="display:flex; gap:16px; margin-bottom: 16px;">
            <div style="font-family:'Outfit'; font-weight:700; font-size:16px; color:#fff; background:var(--charcoal); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;">1</div>
            <div>
              <div style="font-family:'Outfit'; font-weight:700; font-size:15px; margin-bottom:2px;">Embrace the Hopium</div>
              <div style="font-family:'Outfit'; font-size:13px; color:#666; line-height:1.4;">Delusion is the only way forward. We will win at Old Trafford.</div>
            </div>
          </div>
          
          <div style="display:flex; gap:16px; margin-bottom: 16px;">
            <div style="font-family:'Outfit'; font-weight:700; font-size:16px; color:#fff; background:var(--charcoal); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;">2</div>
            <div>
              <div style="font-family:'Outfit'; font-weight:700; font-size:15px; margin-bottom:2px;">Pray to Ange</div>
              <div style="font-family:'Outfit'; font-size:13px; color:#666; line-height:1.4;">We are officially huge Tottenham fans for one day only.</div>
            </div>
          </div>
          
          <div style="display:flex; gap:16px;">
            <div style="font-family:'Outfit'; font-weight:700; font-size:16px; color:#fff; background:var(--charcoal); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;">3</div>
            <div>
              <div style="font-family:'Outfit'; font-weight:700; font-size:15px; margin-bottom:2px;">Accept Your Fate</div>
              <div style="font-family:'Outfit'; font-size:13px; color:#666; line-height:1.4;">Whatever happens, the progression is clear. Just enjoy the ride.</div>
            </div>
          </div>
        </div>
      \`
    },
    {
      bg: 'var(--charcoal)',
      color: '#fff',
      content: \`
        <div style="flex: 1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 40px;">
          <div style="width:72px; height:72px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue'; font-size:32px; color:#fff; margin-bottom:24px; box-shadow:0 0 0 4px rgba(22, 163, 74, 0.2);">TD</div>
          <h2 style="font-family: 'Barlow Condensed'; font-weight:700; font-size: 46px; text-transform:uppercase; line-height: 1; margin-bottom: 16px;">Is the title race<br>actually over?</h2>
          <p style="font-family: 'Outfit'; font-size: 15px; color: #aaa; margin-bottom: 32px;">Drop your completely unbiased predictions below 👇</p>
          
          <div style="padding: 12px 24px; background: #fff; color: var(--charcoal); font-family: 'Outfit'; font-weight: 700; font-size: 14px; border-radius: 100px; text-transform: uppercase; letter-spacing: 1px;">Comment Prediction</div>
        </div>
      \`
    }
  ];

  /* DOM Rendering */
  const track = document.getElementById('track');
  const dotsContainer = document.getElementById('dots');
  const TOTAL_SLIDES = slidesData.length;

  slidesData.forEach((slide, i) => {
    // Determine context
    const isDark = slide.bg.includes('charcoal') || slide.bg.includes('gradient');
    const trackColor = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
    const fillColor  = isDark ? 'var(--green-light)' : 'var(--green)';
    const textColor  = isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)';
    const arrowColor = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)';

    // Calculate Progress Bar
    const pct = ((i + 1) / TOTAL_SLIDES) * 100;
    const progressHTML = \`
      <div class="prog">
        <div class="prog-track" style="background: \${trackColor};">
          <div class="prog-fill" style="width: \${pct}%; background: \${fillColor};"></div>
        </div>
        <div class="prog-num" style="color: \${textColor};">\${i + 1} / \${TOTAL_SLIDES}</div>
      </div>
    \`;

    // Calculate Arrow
    const arrowHTML = (i < TOTAL_SLIDES - 1) ? \`
      <div class="arrow">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="\${arrowColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>
    \` : '';

    // Create Slide
    const slideEl = document.createElement('div');
    slideEl.className = 'slide';
    slideEl.style.background = slide.bg;
    slideEl.style.color = slide.color;
    slideEl.innerHTML = slide.content + progressHTML + arrowHTML;
    track.appendChild(slideEl);

    // Create Dot
    const dot = document.createElement('div');
    dot.className = \`dot \${i === 0 ? 'active' : ''}\`;
    dotsContainer.appendChild(dot);
  });

  /* Swipe Logic */
  let currentIndex = 0;
  let startX = 0;
  let currentX = 0;
  let isDragging = false;

  const viewport = document.getElementById('viewport');
  const dots = document.querySelectorAll('.dot');

  viewport.addEventListener('mousedown', dragStart);
  viewport.addEventListener('touchstart', dragStart, {passive: true});
  window.addEventListener('mousemove', drag);
  window.addEventListener('touchmove', drag, {passive: true});
  window.addEventListener('mouseup', dragEnd);
  window.addEventListener('touchend', dragEnd);

  function dragStart(e) {
    isDragging = true;
    startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
    track.style.transition = 'none';
  }

  function drag(e) {
    if (!isDragging) return;
    const x = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
    const diff = x - startX;
    currentX = (-currentIndex * 420) + diff;
    track.style.transform = \`translateX(\${currentX}px)\`;
  }

  function dragEnd(e) {
    if (!isDragging) return;
    isDragging = false;
    
    const x = e.type.includes('mouse') ? e.pageX : e.changedTouches[0].pageX;
    const diff = x - startX;
    
    if (Math.abs(diff) > 50) {
      if (diff < 0 && currentIndex < TOTAL_SLIDES - 1) currentIndex++;
      else if (diff > 0 && currentIndex > 0) currentIndex--;
    }
    
    updateCarousel();
  }

  function updateCarousel() {
    track.style.transition = 'transform 0.36s cubic-bezier(0.4,0,0.2,1)';
    track.style.transform = \`translateX(\${-currentIndex * 420}px)\`;
    dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
  }
</script>
</body>
</html>
