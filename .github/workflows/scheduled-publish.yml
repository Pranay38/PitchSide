name: Scheduled Publish

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scheduled-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scheduled Publish
        run: |
          curl -X POST https://www.thetouchlinedribble.in/api/scheduled-publish \
            -H "Content-Type: application/json"
