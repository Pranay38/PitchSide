name: Scrape Football Data

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Football Scraper
        run: python scripts/scrape_football_data.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/manager_pressure.json data/matchups.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manager_pressure.json data/matchups.json
          git commit -m "chore: auto-refresh football data"
          git push
