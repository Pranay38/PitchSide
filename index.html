<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Touchline Dribble" />
  <title>The Touchline Dribble — Football Analysis &amp; Opinion</title>
  <meta name="description"
    content="From the touchline to your timeline — sharp football analysis, tactical breakdowns, and bold opinions. Your go-to pitch for the beautiful game. ⚽" />
  <meta name="theme-color" content="#16A34A" />

  <!-- Google Search Console verification -->
  <meta name="google-site-verification" content="%VITE_GOOGLE_SITE_VERIFICATION%" />

  <!-- Google Analytics 4 (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA4_MEASUREMENT_ID%"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '%VITE_GA4_MEASUREMENT_ID%', {
      send_page_view: false // We'll send page views from React Router for SPA accuracy
    });
  </script>

  <!-- Open Graph -->
  <meta property="og:title" content="The Touchline Dribble — Football Analysis & Opinion" />
  <meta property="og:description"
    content="From the touchline to your timeline — sharp football analysis, tactical breakdowns & bold opinions. ⚽🔥" />
  <meta property="og:type" content="website" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Inline theme script to prevent flash -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('pitchside_theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <!-- SEO: Noscript fallback for bots that don't execute JS -->
  <noscript>
    <div style="max-width:800px;margin:0 auto;padding:2rem;font-family:system-ui,sans-serif;color:#fff;background:#0B1120;">
      <h1>The Touchline Dribble — Football Analysis &amp; Opinion</h1>
      <p>From the touchline to your timeline — sharp football analysis, tactical breakdowns, transfer dossiers, and bold opinions for die-hard fans.</p>
      <nav>

          <li><a href="/about">About</a></li>
        </ul>
      </nav>
      <p>Enable JavaScript for the full interactive experience, or subscribe to our <a href="/api/rss">RSS feed</a>.</p>
    </div>
  </noscript>

  <!-- JSON-LD for rich search results -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "The Touchline Dribble",
    "alternateName": "PitchSide",
    "url": "https://thetouchlinedribble.in",
    "description": "From the touchline to your timeline — sharp football analysis, tactical breakdowns, and bold opinions.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://thetouchlinedribble.in/archive?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
